name: Build APK from zip

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          echo "Found: $ZIPFILE"
          unzip -q "$ZIPFILE" -d extracted
          PROJECT_DIR=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-redo-translate-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
